services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: battleship
      POSTGRES_USER: user-db
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user-db -d battleship"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    environment: 
      DATABASE_URL: postgresql+psycopg2://user-db:password123@db:5432/battleship
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  db_data: